<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>RC</title>
<style>button{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}</style>
</head>
<body>
<button id="connect">연결</button>
<button id="accel">가속</button>
<button id="brake">브레이크</button>
<button id="reverse">후진</button>
<p id="val">0</p>
<script>
let ch, q = Promise.resolve();

connect.onclick = async () => {
  const dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [0xffe0] });
  const server = await dev.gatt.connect();
  ch = await (await server.getPrimaryService(0xffe0)).getCharacteristic(0xffe1);
  connect.textContent = "연결됨";
};

function send(v) {
  val.textContent = v;
  q = q.then(() => ch.writeValueWithoutResponse(new TextEncoder().encode(v + "\n")));
}

// 누르고 있는 동안: 가속 1, 브레이크 2, 후진 3 / 떼면 0
[[accel, 1], [brake, 2], [reverse, 3]].forEach(([b, v]) => {
  b.onpointerdown = () => send(v);
  b.onpointerup = b.onpointercancel = () => send(0);
});
</script>
</body>
</html>
