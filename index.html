<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>RC</title>
<style>button{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}</style>
</head>
<body>
<button id="connect">연결</button>
<button id="accel">가속</button>
<button id="brake">브레이크</button>
<button id="reverse">후진</button>
<p id="val">0</p>
<script>
let writer, timer, q = Promise.resolve();

connect.onclick = async () => {
  const port = await navigator.serial.requestPort();
  await port.open({ baudRate: 9600 });
  writer = port.writable.getWriter();
  connect.textContent = "연결됨";
};

function write(v) {
  q = q.then(() => writer.write(new TextEncoder().encode(v + "\n"))).catch(() => {});
}

// 누르고 있는 동안 150ms마다 반복 전송 (STM32 페일세이프용)
function send(v) {
  val.textContent = v;
  clearInterval(timer);
  write(v);
  if (v) timer = setInterval(() => write(v), 150);
}

// 가속 1, 브레이크 2, 후진 3 / 떼면 0
[[accel, 1], [brake, 2], [reverse, 3]].forEach(([b, v]) => {
  b.onpointerdown = () => send(v);
  b.onpointerup = b.onpointercancel = () => send(0);
});
</script>
</body>
</html>
